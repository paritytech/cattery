{{- if and (eq (include "cattery.coordinationBackend" .) "k8s") .Values.rbac.create }}
# Leader election for the "k8s" coordination backend. cattery leases one
# coordination.k8s.io Lease per tray type (see lib/election). LeaseLock needs
# get/create/update; ReleaseOnCancel updates the holder, it does not delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cattery.fullname" . }}-leader-election
  labels:
    {{- include "cattery.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cattery.fullname" . }}-leader-election
  labels:
    {{- include "cattery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cattery.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "cattery.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
