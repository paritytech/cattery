# Number of cattery replicas.
#
# >1 requires a shared coordination backend (config.coordination.backend set to
# mongo or k8s) so each tray type's GitHub session runs on a single replica.
# With the default "memory" backend cattery is a singleton — keep this at 1.
replicaCount: 1

# Deployment update strategy. Recreate suits a single replica (the GitHub
# session must not overlap across pods). For multiple replicas with a shared
# coordination backend, switch to RollingUpdate so trays stay served during
# rollouts, e.g.:
#   updateStrategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxUnavailable: 0
updateStrategy:
  type: Recreate

image:
  repository: docker.io/paritytech/cattery
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when unset.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30
priorityClassName: ""

# Cattery config rendered into /etc/cattery/config.yaml.
# See https://github.com/paritytech/cattery/blob/main/docs/configuration.md
config:
  server:
    listenAddress: "0.0.0.0:5137"
    # Optionally serve /status and /metrics on a separate port. Leave empty
    # to serve them on listenAddress.
    statusListenAddress: "0.0.0.0:3925"
    # URL agents use to reach the server. Must be reachable from runners.
    advertiseUrl: http://cattery.example.com

  database:
    uri: mongodb://mongodb:27017/
    database: cattery

  # Leader election for running multiple replicas. With the default "memory"
  # backend cattery is a singleton (replicaCount 1). For >1 replica pick a shared
  # backend so each tray type's poller runs on one replica at a time:
  #   - mongo: leases in the configured database (no extra setup)
  #   - k8s:   native coordination.k8s.io Leases (this chart provisions the RBAC
  #            and mounts the SA token; see rbac.create)
  coordination:
    backend: memory          # memory | mongo | k8s
    # lease:                 # cadence for mongo/k8s; defaults: ttl 30s, renew ttl/3, retry 5s
    #   ttl: 30s
    #   renewInterval: 10s
    #   retryInterval: 5s
    # kubernetes:            # k8s backend only
    #   namespace: ""        # defaults to the release namespace (via POD_NAMESPACE)
    #   leaseNamePrefix: "cattery-"

  # One entry per GitHub App / organization.
  github: []
  # - name: my-org
  #   appId: 123456
  #   appClientId: Iv123abC
  #   installationId: 987654321
  #   privateKeyPath: /cattery/secrets/my-org/private-key.pem

  providers: []
  # - name: docker-local
  #   type: docker
  # - name: gce
  #   type: google
  #   project: my-gcp-project
  # - name: k8s                # trays as Jobs in THIS cluster: in-cluster
  #   type: kubernetes         # credentials, RBAC and the SA token come from
  #   namespace: cattery-runners   # this chart; must equal runners.namespace
  #   # deployTimeout: 5m
  # - name: k8s-remote         # trays in ANOTHER cluster: a token + CA (or a
  #   type: kubernetes         # kubeconfig) mounted through secretFiles
  #   server: https://10.0.0.1:6443
  #   tokenFile: /cattery/secrets/target/token
  #   caFile: /cattery/secrets/target/ca.crt
  #   namespace: cattery-runners

  trayTypes: []
  # - name: my-runner
  #   provider: docker-local
  #   githubOrg: my-org
  #   runnerGroupId: 1
  #   maxTrays: 5
  #   shutdown: true
  #   config:
  #     image: my-runner-image:latest
  # - name: k8s-small          # DNS-1123 label, at most 40 characters
  #   provider: k8s
  #   githubOrg: my-org
  #   runnerGroupId: 1
  #   maxTrays: 10
  #   config:
  #     image: ghcr.io/actions/actions-runner:2.333.0
  #     resources:
  #       requests: {cpu: "2", memory: 4Gi}
  # - name: k8s-large
  #   provider: k8s
  #   githubOrg: my-org
  #   runnerGroupId: 1
  #   maxTrays: 5
  #   config:
  #     podTemplateRef: runner-large   # see runnerPodTemplates below

# Runner-side objects for a kubernetes provider that targets THIS cluster.
# Providers that point at another cluster (kubeconfig / server) get nothing
# from this block.
runners:
  # Namespace the runner Jobs live in; the runner RBAC, ServiceAccount and
  # PodTemplates below are created there. Every in-cluster kubernetes provider
  # must set config.providers[].namespace to the same value (the chart refuses
  # to render otherwise). Defaults to the release namespace.
  namespace: ""
  createNamespace: false

  # Identity of the runner pods, referenced from
  # config.trayTypes[].config.serviceAccountName. Runner pods execute
  # third-party code and should not run as the server's account or as the
  # namespace's default account.
  serviceAccount:
    create: false
    name: ""            # defaults to <release fullname>-runner
    annotations: {}     # e.g. GKE Workload Identity
    # Role rules granted to that account in runners.namespace; empty creates
    # no Role. Pods only see them when the tray type also sets
    # automountServiceAccountToken: true. The Actions runner's Kubernetes
    # container hooks (jobs with `container:` / `services:` without Docker)
    # need roughly:
    # rules:
    #   - apiGroups: [""]
    #     resources: ["pods", "pods/exec", "pods/log"]
    #     verbs: ["get", "list", "watch", "create", "delete"]
    #   - apiGroups: ["batch"]
    #     resources: ["jobs"]
    #     verbs: ["get", "list", "create", "delete"]
    #   - apiGroups: [""]
    #     resources: ["secrets"]
    #     verbs: ["get", "list", "create", "delete"]
    rules: []

  # core/v1 PodTemplate objects for tray types that use
  # config.podTemplateRef: the key is the object name, the value is a pod
  # template (metadata.labels/annotations + spec). Use these for anything the
  # typed trayType.config fields cannot express — sidecars such as
  # docker-in-docker, volumes, affinity, security contexts — and for map keys
  # whose case matters: unlike config.trayTypes[].config, which cattery's
  # loader lowercases, these are rendered verbatim. cattery injects its agent
  # into the container named `runner` (or the only container) and forces
  # restartPolicy Never.
  podTemplates: {}
  # podTemplates:
  #   runner-large:
  #     metadata:
  #       labels:
  #         team: ci
  #     spec:
  #       serviceAccountName: cattery-runner
  #       nodeSelector:
  #         cloud.google.com/gke-spot: "true"
  #       containers:
  #         - name: runner
  #           image: ghcr.io/actions/actions-runner:2.333.0
  #           resources:
  #             requests: {cpu: "8", memory: 32Gi}

# Extra arbitrary files mounted into the container.
#
# Use this for GitHub App private keys and any other sensitive file the
# config.yaml references by path.
#
# Two modes per entry:
#   1. `value` — inline content, rendered into a Secret managed by this chart
#      (convenient, but puts the secret in your values file).
#   2. `existingSecret` / `existingSecretKey` — reference an externally
#      managed Secret (recommended for production).
secretFiles: {}
# secretFiles:
#   my-org-private-key:
#     mountPath: /cattery/secrets/my-org/private-key.pem
#     value: |
#       -----BEGIN RSA PRIVATE KEY-----
#       ...
#       -----END RSA PRIVATE KEY-----
#   other-org-private-key:
#     mountPath: /cattery/secrets/other-org/private-key.pem
#     existingSecret: other-org-github-app
#     existingSecretKey: private-key.pem

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Cattery calls this cluster's API for the "k8s" coordination backend and
  # for a "kubernetes" tray provider that uses in-cluster credentials; either
  # forces the token on regardless of this setting. Otherwise keep it off.
  automountServiceAccountToken: false

# RBAC created only for what the config needs:
#   - config.coordination.backend "k8s": a Role + RoleBinding in the release
#     namespace granting get/create/update/delete on coordination.k8s.io Leases.
#   - a "kubernetes" provider with in-cluster credentials: a Role + RoleBinding
#     in runners.namespace granting create/get/delete on batch Jobs,
#     get/list/watch on pods and get on podtemplates.
# Set false to manage that RBAC yourself.
rbac:
  create: true

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 65532

# The upstream image runs as the non-root `cattery` user (uid 65532).
# These are recommended hardening flags — enable them if your providers
# don't need any extra capabilities.
securityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 65532
  # runAsGroup: 65532
  # capabilities:
  #   drop: ["ALL"]
  # seccompProfile:
  #   type: RuntimeDefault

# Extra environment variables (e.g. to override config via env, for debugging).
env: []
# env:
#   - name: TZ
#     value: UTC

# envFrom entries — handy for pulling MongoDB URIs or provider credentials
# out of existing ConfigMaps / Secrets without embedding them in values.
envFrom: []
# envFrom:
#   - secretRef:
#       name: cattery-runtime

# Extra volumes/volumeMounts for anything `secretFiles` does not cover
# (e.g. hostPath for Docker socket, projected tokens, extra ConfigMaps).
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 5137
  # Exposed only when config.server.statusListenAddress is set.
  statusPort: 3925
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: cattery.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - secretName: cattery-tls
  #   hosts:
  #     - cattery.example.com

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Probes hit /healthcheck. They target the status port when
# config.server.statusListenAddress is set, otherwise the main http port.
# /healthcheck is registered on both ports.
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
