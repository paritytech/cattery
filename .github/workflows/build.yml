name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
          description: 'Tag name'
          required: true
  release:
    types: [created]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      ref: ${{ steps.compute.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compute version and ref
        id: compute
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              TAG="${{ github.event.inputs.tag_name }}"
              if ! gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                echo "::error::Release for tag '${TAG}' does not exist. Create the release first."
                exit 1
              fi
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
              ;;
            release)
              TAG="${{ github.event.release.tag_name }}"
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              echo "version=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Integration tests are split by backend so a flake in one infra (Mongo vs a
  # kind cluster) can't mask a real failure in the other. Each job also runs the
  # untagged unit tests — the `_mongo` / `_k8s` build tags only gate the
  # integration files (see //go:build lines under src/lib/election).
  integration-mongo:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: '1.44'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: run mongo integration + unit tests
        working-directory: src
        env:
          CGO_ENABLED: 1   # required for -race
        run: |
          go test -tags=integration_mongo -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
          # go 1.25 covdata bug causes exit code 1 for packages without tests
          # fail only if actual test failures exist
          if grep -q "^FAIL" test-output.txt; then
            exit 1
          fi

      - name: show coverage
        working-directory: src
        run: go tool cover -func=coverage.out

  integration-k8s:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      # A bare kind cluster is enough. The election tests only use the built-in
      # coordination.k8s.io Lease API; the kubernetes provider tests create
      # Jobs in the default namespace and pull registry.k8s.io/pause plus the
      # published cattery image (override with CATTERY_TEST_AGENT_IMAGE after
      # `kind load docker-image`). Both connect out-of-cluster via the
      # kubeconfig kind-action writes to ~/.kube/config.
      - name: Start kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cattery-test

      - name: run k8s integration + unit tests
        working-directory: src
        env:
          CGO_ENABLED: 1   # required for -race
        run: |
          go test -tags=integration_k8s -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
          # go 1.25 covdata bug causes exit code 1 for packages without tests
          # fail only if actual test failures exist
          if grep -q "^FAIL" test-output.txt; then
            exit 1
          fi

      - name: show coverage
        working-directory: src
        run: go tool cover -func=coverage.out

      # Second pass for the kubernetes provider as the identity the chart
      # gives it: apply the chart's ServiceAccount and runner RBAC, mint a
      # token for that account and run the provider tests through the
      # server/tokenFile/caFile access mode. This proves the Role in
      # charts/cattery/templates/rbac.yaml is sufficient for everything the
      # provider does and exercises the remote-cluster code path for real.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: apply the chart's runner RBAC and mint a token for it
        run: |
          set -euo pipefail
          helm template cattery charts/cattery \
            --set 'config.providers[0].name=k8s,config.providers[0].type=kubernetes' \
            -s templates/serviceaccount.yaml -s templates/rbac.yaml | kubectl apply -f -
          mkdir -p "${RUNNER_TEMP}/kube"
          kubectl create token cattery --duration=1h > "${RUNNER_TEMP}/kube/token"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "${RUNNER_TEMP}/kube/ca.crt"
          {
            echo "CATTERY_TEST_KUBE_SERVER=$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
            echo "CATTERY_TEST_KUBE_TOKEN_FILE=${RUNNER_TEMP}/kube/token"
            echo "CATTERY_TEST_KUBE_CA_FILE=${RUNNER_TEMP}/kube/ca.crt"
          } >> "${GITHUB_ENV}"

      - name: run kubernetes provider tests as the chart's service account
        working-directory: src
        env:
          CGO_ENABLED: 1
        run: go test -tags=integration_k8s -race -count=1 -run 'TestKubernetesProvider' ./lib/trays/providers/

  release:
    needs: [integration-mongo, integration-k8s, setup]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
       with:
         ref: ${{ needs.setup.outputs.ref }}

     - name: Set up Go
       uses: actions/setup-go@v5
       with:
         go-version-file: src/go.mod

     - name: Install dependencies
       run: go mod download -C src

     - name: Build
       env:
         CGO_ENABLED: 0
         GOOS: linux
         GOARCH: amd64
       run: |
         go build -C src \
           -trimpath \
           -ldflags="-s -w -X cattery/lib/version.Version=${{ env.VERSION }}" \
           -o ../bin/cattery_linux_x86_${{ env.VERSION }}

     - name: Verify binary is statically linked
       run: |
         file bin/cattery_linux_x86_${{ env.VERSION }}
         # ldd prints "not a dynamic executable" on fully-static binaries;
         # exit 0 either way and just surface the result.
         ldd bin/cattery_linux_x86_${{ env.VERSION }} || true

     - run: ls -la bin/

     - name: Upload artifacts to release
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         gh release upload "${VERSION}" bin/cattery* --repo "${{ github.repository }}" --clobber

  docker-build:
    needs: [integration-mongo, integration-k8s, setup]
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'main' || null }}
    env:
      REGISTRY_PATH: docker.io/${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'paritytech' || 'paritypr' }}/cattery
      VERSION: ${{ needs.setup.outputs.version }}
      EXTRA_TAG: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'latest' || 'main' }}
      PUSH: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || contains(github.event.pull_request.labels.*.name, 'image-push') || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Docker login
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          tags: |
            ${{ env.REGISTRY_PATH }}:${{ env.VERSION }}
            ${{ env.REGISTRY_PATH }}:${{ env.EXTRA_TAG }}
          push: ${{ env.PUSH }}
          build-args: |
            CATTERY_VERSION=${{ env.VERSION }}
