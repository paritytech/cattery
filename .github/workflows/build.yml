name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
          description: 'Tag name'
          required: true
  release:
    types: [created]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      ref: ${{ steps.compute.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compute version and ref
        id: compute
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              TAG="${{ github.event.inputs.tag_name }}"
              if ! gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                echo "::error::Release for tag '${TAG}' does not exist. Create the release first."
                exit 1
              fi
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
              ;;
            release)
              TAG="${{ github.event.release.tag_name }}"
              echo "version=${TAG}" >> "$GITHUB_OUTPUT"
              echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              echo "version=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Integration tests are split by backend so a flake in one infra (Mongo vs a
  # kind cluster) can't mask a real failure in the other. Each job also runs the
  # untagged unit tests — the `_mongo` / `_k8s` build tags only gate the
  # integration files (see //go:build lines under src/lib/election).
  integration-mongo:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: '1.44'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: run mongo integration + unit tests
        working-directory: src
        env:
          CGO_ENABLED: 1   # required for -race
        run: |
          go test -tags=integration_mongo -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
          # go 1.25 covdata bug causes exit code 1 for packages without tests
          # fail only if actual test failures exist
          if grep -q "^FAIL" test-output.txt; then
            exit 1
          fi

      - name: show coverage
        working-directory: src
        run: go tool cover -func=coverage.out

  integration-k8s:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      # A bare kind cluster is enough: the election tests only use the built-in
      # coordination.k8s.io Lease API and connect out-of-cluster via the
      # kubeconfig kind-action writes to ~/.kube/config.
      - name: Start kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cattery-test

      - name: run k8s integration + unit tests
        working-directory: src
        env:
          CGO_ENABLED: 1   # required for -race
        run: |
          go test -tags=integration_k8s -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
          # go 1.25 covdata bug causes exit code 1 for packages without tests
          # fail only if actual test failures exist
          if grep -q "^FAIL" test-output.txt; then
            exit 1
          fi

      - name: show coverage
        working-directory: src
        run: go tool cover -func=coverage.out

  # Cross-compiles cattery for every released platform. Runs on every event, so
  # a platform that stops compiling fails the pull request instead of the
  # release. The binaries are only kept when there is a release to attach them
  # to (see the release job).
  binaries:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
       with:
         ref: ${{ needs.setup.outputs.ref }}

     - name: Set up Go
       uses: actions/setup-go@v5
       with:
         go-version-file: src/go.mod

     - name: Install dependencies
       run: go mod download -C src

     # Binaries are named cattery_<os>_<arch>_<version>, plus .exe on windows.
     # The server looks release assets up by that exact name, so keep the name
     # and the platform list in sync with src/lib/agentBinaries.
     - name: Build
       env:
         CGO_ENABLED: 0
       run: |
         for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
           export GOOS="${platform%/*}" GOARCH="${platform#*/}"
           ext=""
           if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

           echo "::group::${platform}"
           go build -C src \
             -trimpath \
             -ldflags="-s -w -X cattery/lib/version.Version=${VERSION}" \
             -o "../bin/cattery_${GOOS}_${GOARCH}_${VERSION}${ext}"
           echo "::endgroup::"
         done

     - name: Show binaries
       run: |
         ls -la bin/
         # Surfaces the target and that each binary is statically linked.
         file bin/*

     - name: Keep binaries for the release job
       if: env.IS_RELEASE == 'true'
       uses: actions/upload-artifact@v4
       with:
         name: cattery-binaries
         path: bin/
         if-no-files-found: error
         retention-days: 1

  release:
    needs: [integration-mongo, integration-k8s, setup, binaries]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
     - name: Download binaries
       uses: actions/download-artifact@v4
       with:
         name: cattery-binaries
         path: bin/

     - run: ls -la bin/

     - name: Upload artifacts to release
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         gh release upload "${VERSION}" bin/cattery* --repo "${{ github.repository }}" --clobber

  docker-build:
    needs: [integration-mongo, integration-k8s, setup]
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'main' || null }}
    env:
      REGISTRY_PATH: docker.io/${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'paritytech' || 'paritypr' }}/cattery
      VERSION: ${{ needs.setup.outputs.version }}
      EXTRA_TAG: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 'latest' || 'main' }}
      PUSH: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || contains(github.event.pull_request.labels.*.name, 'image-push') || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Docker login
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The Dockerfile cross-compiles Go on the build host; emulation is only
      # needed for the few RUN steps of the arm64 runtime stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_PATH }}:${{ env.VERSION }}
            ${{ env.REGISTRY_PATH }}:${{ env.EXTRA_TAG }}
          push: ${{ env.PUSH }}
          build-args: |
            CATTERY_VERSION=${{ env.VERSION }}
