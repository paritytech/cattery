server:
  listenAddress: "0.0.0.0:5137"
  advertiseUrl: https://cattery.my-org.com

database:
  uri: mongodb://localhost:27017/cattery
  database: cattery

# Optional. Stale-tray cleanup loop. Defaults shown below.
# A tray sitting in `status` for longer than its threshold is deleted.
# `running` is intentionally absent — running trays are never stale.
stale:
  pollInterval: 1m
  thresholds:
    creating: 5m
    registering: 5m
    registered: 15m
    deleting: 15m

# Optional. Leader election for running multiple cattery replicas. Each tray
# type's scale set poller (the GitHub session) runs on exactly one replica — the
# leader for that tray type — while every replica keeps serving the tray HTTP
# API, so trays stay served across rollouts and failovers.
#
# backend "memory" (default) is a no-op that always leads — correct ONLY for a
# single replica. Running multiple replicas on "memory" makes every replica
# fight for every tray type's session. For multiple replicas pick a shared
# backend:
#   - mongo: leases stored in the configured database (no extra setup)
#   - k8s:   native coordination.k8s.io Leases (must run in-cluster, with RBAC
#            to get/create/update leases in its namespace)
coordination:
  backend: memory          # memory | mongo | k8s
  # Lease cadence (ignored by the memory backend). Defaults shown below.
  # ttl bounds worst-case failover: a dead leader's tray type is reclaimable
  # after ~ttl.
  lease:
    ttl: 30s               # lease validity
    renewInterval: 10s     # leader renews this often (defaults to ttl/3)
    retryInterval: 5s      # non-leaders retry acquisition this often
  # k8s backend only; both optional:
  # kubernetes:
  #   namespace: cattery          # defaults to the pod's namespace
  #   leaseNamePrefix: "cattery-" # prepended to the sanitized tray type name

github:
  - name: paritytech-stg
    appId: 123456
    installationId: 654321
    appClientId: Iv123abC
    privateKeyPath: path/to/github-private-key.pem
    webhookSecret: my-webhook-secret

  - name: paritytech
    appId: 123456
    installationId: 654321
    appClientId: Iv123abC
    privateKeyPath: path/to/github-private-key.pem
    webhookSecret: my-webhook-secret

providers:
  - name: docker-local
    type: docker
    catteryUrl: http://host.containers.internal:5137 # example for podman

  - name: gce-stg
    type: google
    project: my-gcp-project
    credentialsFile: path/to/credentials.json

  - name: nomad-scw
    type: nomad
    address: https://nomad.internal:4646
    # ACL token. Needs dispatch-job (StartDeploy), read-job (WaitDeploy reads
    # the evaluation), list-jobs (CleanTray's leaked-child recovery scan),
    # and deregister-job/purge-job (CleanTray purges the dispatched child)
    # on the parent job's namespace.
    token: <nomad-acl-token>
    namespace: runners       # optional
    region: global           # optional
    tlsCaFile: path/to/nomad-ca.pem  # optional
    insecure: false          # optional, skip TLS verification (dev only)

trayTypes:
  - name: cattery-tiny
    provider: docker-local
    shutdown: false
    runnerGroupId: 3
    githubOrg: My-Github-Org
    config:
      image: cattery-runner-tiny:latest

  - name: cattery-gce
    config:
      instanceTemplate: global/instanceTemplates/<instance-template>
      machineType: e2-standard-2
      project: my-gcp-project
      zones:
        - us-west1-a
        - us-west1-b
    extraMetadata:
      # can be: version (0.0.2), server (to download binary from server) or a commit hash
      cattery-agent-version: 0.0.4
      # cattery-agent-version: 13d197aa1e73db09514772e55794b3a0f9b7952b
    githubOrg: My-Github-Org
    maxTrays: 3 # max number of VMs of this type
    provider: gce
    runnerGroupId: 3 # check in github org settings -> Runner groups
    shutdown: true

  - name: cattery-nomad
    provider: nomad-scw
    githubOrg: My-Github-Org
    runnerGroupId: 3
    maxTrays: 5
    shutdown: true
    config:
      # ID of a parameterized parent job already registered in Nomad. Resources,
      # driver and constraints come from that job spec — Nomad does not allow
      # overriding them at dispatch time. Use distinct parent jobs for distinct
      # resource shapes.
      jobId: scw-cattery-runner-tray
      # Path inside the guest where the GitHub Actions runner distribution
      # lives. Passed as --runner-folder to `cattery agent`. Defaults to
      # /cattery if omitted.
      runnerFolder: /cattery
      # Optional inline bash, executed after the agent binary is downloaded
      # and before the agent is exec'd. The parent job is expected to have
      # exported TRAY_NAME, BOOTSTRAP_TOKEN and CATTERY_URL from meta.
      script: |
        echo "extra setup for $TRAY_NAME"
        # mkfs / mount scratch volume, install build tools, etc.
